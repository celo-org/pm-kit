# Thin caller — copy to <repo>/.github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: celo-org/pm-kit/.github/workflows/ci-docs-mintlify.yml@main
